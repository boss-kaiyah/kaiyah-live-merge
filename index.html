<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FINAL NO FETCH</title></head><body style="background:#000;color:#fff;font-family:Arial;padding:10px">
<h2 style="color:#00FF88;text-align:center">V18 FINAL - NO FETCH - TUNAY NA DUGTONG</h2>
<input type="file" id="f" accept="video/*" multiple style="width:100%;padding:10px;background:#222;color:#fff;border-radius:10px">
<div id="info" style="color:#FFD700;margin:10px 0">Pili ka 2 files - Dapat lumabas dito</div>
<video id="v" controls playsinline style="width:100%;background:#000;border:2px solid #00FF88;border-radius:10px"></video>
<canvas id="c" style="display:none"></canvas>
<div style="height:14px;background:#222;border-radius:10px;margin:10px 0"><div id="bar" style="height:100%;width:0%;background:#00FF88;border-radius:10px"></div></div>
<div id="log" style="background:#111;padding:8px;border-radius:8px;font-size:11px;white-space:pre-wrap">Log: Ready - No Fetch - No unpkg - Pure Browser - Tunay na dugtong!</div>
<button id="merge" style="width:100%;padding:15px;background:#00FF88;color:#000;font-weight:bold;border:none;border-radius:25px;margin-top:10px">🔗 MERGE - TUNAY NA DUGTONG - NO FETCH!</button>
<button id="dl" style="width:100%;padding:15px;background:#FFD700;color:#000;font-weight:bold;border:none;border-radius:25px;display:none;margin-top:10px">💾 DOWNLOAD - BUONG VIDEO!</button>
<script>
let files=[],chunks=[],lastUrl=null,recorder=null;
const v=document.getElementById('v'),c=document.getElementById('c'),ctx=c.getContext('2d'),info=document.getElementById('info'),bar=document.getElementById('bar'),logEl=document.getElementById('log');
function log(m){logEl.textContent+='\n'+m;console.log(m);}
document.getElementById('f').onchange=e=>{
 files=Array.from(e.target.files);
 info.textContent=files.length+' files: '+files.map(f=>f.name).join(', ');
 log(files.length+' files selected - No fetch needed!');
 if(files[0]){ v.src=URL.createObjectURL(files[0]); }
};
document.getElementById('merge').onclick=async()=>{
 if(files.length==0)return alert('Pili ka files!');
 log('Starting PROPER CANVAS - No Fetch - Tunay na dugtong - '+files.length+' files');
 c.width=1280;c.height=720;
 const canvasStream=c.captureStream(30);
 chunks=[];
 recorder=new MediaRecorder(canvasStream,{mimeType:'video/webm;codecs=vp9'});
 recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
 let idx=0;
 recorder.start(100);
 log('Recorder started - Playing files one by one - Proper concat!');
 async function playNext(){
  if(idx>=files.length){
   recorder.stop();
   recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    lastUrl=URL.createObjectURL(blob);
    v.src=lastUrl;
    v.muted=false;
    document.getElementById('dl').style.display='block';
    bar.style.width='100%';
    info.textContent='DONE! Tunay na dugtong! '+files.length+' files - Buong video!';
    log('DONE! Proper concat - No fetch - Buong video tutugtog!');
    alert('DONE! Tunay na nadugtong! Buong video - walang fetch error!');
   };
   return;
  }
  const file=files[idx];
  log('Playing '+(idx+1)+'/'+files.length+': '+file.name);
  info.textContent='Merging '+(idx+1)+'/'+files.length+': '+file.name;
  bar.style.width=Math.round(idx/files.length*100)+'%';
  const tmpV=document.createElement('video');
  tmpV.src=URL.createObjectURL(file);
  tmpV.muted=true;
  tmpV.playsInline=true;
  tmpV.onloadedmetadata=()=>tmpV.play().catch(()=>{});
  const drawLoop=()=>{
   if(tmpV.ended||tmpV.paused)return;
   try{ctx.drawImage(tmpV,0,0,c.width,c.height);}catch(e){}
   requestAnimationFrame(drawLoop);
  };
  tmpV.onplay=()=>drawLoop();
  tmpV.onended=()=>{ idx++; playNext(); };
  v.src=tmpV.src;
  v.muted=true;
  try{await v.play();}catch(e){log('v play error: '+e.message);}
  // fallback check
  const iv=setInterval(()=>{ if(v.ended){clearInterval(iv); tmpV.onended(); } },500);
 }
 playNext();
};
document.getElementById('dl').onclick=()=>{
 const a=document.createElement('a');a.href=lastUrl;a.download='PROPER_TALI_NO_FETCH_'+Date.now()+'.webm';a.click();
};
</script></body></html>
