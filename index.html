<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V27 LAHAT AYOS</title></head><body style="background:#000;color:#fff;font-family:Arial;padding:12px">
<h2 style="color:#00FF88;text-align:center">V27 - LAHAT AYOS NA</h2>
<input type="file" id="f" accept="video/*" multiple style="width:100%;padding:12px;background:#222;color:#fff;border-radius:10px">
<div id="info" style="color:#FFD700;margin:8px 0">V27 - Normal 1x - Walang patong - Malinis</div>
<video id="v" controls playsinline style="width:100%;background:#000;border:2px solid #00FF88;border-radius:10px;min-height:220px"></video>
<div style="height:12px;background:#222;border-radius:10px;margin:8px 0"><div id="bar" style="height:100%;width:0%;background:#00FF88"></div></div>
<button id="merge" style="width:100%;padding:15px;background:#00FF88;color:#000;font-weight:bold;border:none;border-radius:25px">🔗 MERGE - LAHAT AYOS!</button>
<button id="dl" style="width:100%;padding:15px;background:#FFD700;color:#000;font-weight:bold;border:none;border-radius:25px;display:none;margin-top:8px">💾 DOWNLOAD - FINAL!</button>
<div id="log" style="background:#111;padding:6px;border-radius:6px;font-size:10px;margin-top:6px">Log: V27</div>
<script>
let files=[],chunks=[],lastUrl=null;
const v=document.getElementById('v'),info=document.getElementById('info'),bar=document.getElementById('bar'),logEl=document.getElementById('log');
function log(m){ logEl.textContent+='\n'+m; }
document.getElementById('f').onchange=e=>{
 files=[...e.target.files];
 info.textContent=files.length+' files - V27 Ready - Lahat ayos';
 if(files[0]){ v.src=URL.createObjectURL(files[0]); v.playbackRate=1; }
};
document.getElementById('merge').onclick=async()=>{
 if(!files.length) return alert('Pili ka files!');
 chunks=[]; bar.style.width='0%'; log('Start V27 - Lahat ayos');
 v.muted=false; v.playbackRate=1;
 v.src=URL.createObjectURL(files[0]);
 await new Promise(r=>{ v.onloadeddata=()=>r(); });
 await v.play().catch(()=>{});
 const stream=v.captureStream();
 const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus',videoBitsPerSecond:2500000});
 rec.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
 rec.start(200);
 let idx=0;
 v.onended=async()=>{
  rec.pause(); // PAUSE MUNA - PARA WALANG PATONG!
  log('Pause - tapos na file '+(idx+1));
  await new Promise(r=>setTimeout(r,500)); // 0.5 sec pahinga
  idx++;
  bar.style.width=Math.round(idx/files.length*100)+'%';
  if(idx>=files.length){
   rec.stop();
   rec.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    lastUrl=URL.createObjectURL(blob);
    v.src=lastUrl; v.onended=null; v.playbackRate=1; v.play().catch(()=>{});
    document.getElementById('dl').style.display='block';
    info.textContent='DONE! V27 - Lahat ayos - Normal - Walang patong!';
    log('DONE V27!');
   };
   return;
  }
  v.src=URL.createObjectURL(files[idx]);
  await new Promise(r=>{ v.onloadeddata=()=>r(); });
  v.playbackRate=1;
  info.textContent='Merging '+(idx+1)+'/'+files.length+' - Normal 1x';
  await v.play().catch(()=>{});
  rec.resume(); // RESUME - MALINIS NA NEXT FILE!
  log('Resume - file '+(idx+1));
 };
};
document.getElementById('dl').onclick=()=>{
 const a=document.createElement('a'); a.href=lastUrl; a.download='V27_LAHAT_AYOS_'+Date.now()+'.webm'; a.click();
};
</script></body></html>
