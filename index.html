<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V28 FIX GREY</title></head><body style="background:#000;color:#fff;font-family:Arial;padding:12px">
<h2 style="color:#00FF88;text-align:center">V28 - FIX GREY 0:00 - LAHAT AYOS</h2>
<input type="file" id="f" accept="video/*" multiple style="width:100%;padding:12px;background:#222;color:#fff;border-radius:10px">
<div id="info" style="color:#FFD700;margin:8px 0">V28 - Fix grey 0:00 - Normal 1x</div>
<video id="v" controls playsinline muted style="width:100%;background:#000;border:2px solid #00FF88;border-radius:10px;min-height:220px"></video>
<div style="height:12px;background:#222;border-radius:10px;margin:8px 0"><div id="bar" style="height:100%;width:0%;background:#00FF88"></div></div>
<button id="merge" style="width:100%;padding:15px;background:#00FF88;color:#000;font-weight:bold;border:none;border-radius:25px">🔗 MERGE - FIX GREY!</button>
<button id="dl" style="width:100%;padding:15px;background:#FFD700;color:#000;font-weight:bold;border:none;border-radius:25px;display:none;margin-top:8px">💾 DOWNLOAD - FINAL!</button>
<div id="log" style="background:#111;padding:6px;border-radius:6px;font-size:10px;margin-top:6px">Log: V28 - Fix grey 0:00</div>
<script>
let files=[],chunks=[],lastUrl=null;
const v=document.getElementById('v'),info=document.getElementById('info'),bar=document.getElementById('bar'),logEl=document.getElementById('log');
function log(m){ logEl.textContent+='\n'+m; console.log(m); }
document.getElementById('f').onchange=e=>{
 files=[...e.target.files];
 info.textContent=files.length+' files - V28 Fix Grey - Ready';
 if(files[0]){ v.src=URL.createObjectURL(files[0]); v.playbackRate=1; v.muted=true; }
};
document.getElementById('merge').onclick=async()=>{
 if(!files.length) return alert('Pili ka files!');
 chunks=[]; bar.style.width='2%';
 v.muted=true; // MUTED MUNA - PARA PAYAGAN NI CHROME MAG-PLAY!
 v.playbackRate=1;
 v.src=URL.createObjectURL(files[0]);
 log('Loading file 1...');
 await new Promise(r=>{ v.onloadeddata=()=>r(); v.onerror=()=>{ log('Error loading - try H.264'); r(); }; });
 try{ await v.play(); log('Playing file 1...'); }catch(e){ log('Play blocked: '+e.message+' - Try tap video'); v.controls=true; }
 const stream=v.captureStream();
 log('Stream captured - tracks: '+stream.getTracks().length);
 const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus',videoBitsPerSecond:2500000});
 rec.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); log('Chunk: '+(e.data.size/1024).toFixed(0)+'KB'); };
 rec.start(200);
 let idx=0;
 v.onended=async()=>{
  rec.pause();
  log('Ended file '+(idx+1)+' - pause');
  await new Promise(r=>setTimeout(r,600));
  idx++;
  bar.style.width=Math.round(idx/files.length*100)+'%';
  if(idx>=files.length){
   rec.stop();
   rec.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    lastUrl=URL.createObjectURL(blob);
    v.src=lastUrl; v.onended=null; v.muted=false; v.playbackRate=1; v.controls=true;
    v.play().then(()=>log('Preview final playing')).catch(()=>{});
    document.getElementById('dl').style.display='block';
    info.textContent='DONE! V28 - Buo na - Hindi grey - Normal 1x!';
    log('DONE! Size: '+(blob.size/1024/1024).toFixed(1)+'MB');
   };
   return;
  }
  v.src=URL.createObjectURL(files[idx]);
  await new Promise(r=>{ v.onloadeddata=()=>r(); });
  v.playbackRate=1; v.muted=true;
  info.textContent='Merging '+(idx+1)+'/'+files.length+' - V28 Fix';
  try{ await v.play(); log('Playing file '+(idx+1)); rec.resume(); log('Resume recording'); }catch(e){ log('Play error: '+e.message); }
 };
};
document.getElementById('dl').onclick=()=>{
 const a=document.createElement('a'); a.href=lastUrl; a.download='V28_FINAL_'+Date.now()+'.webm'; a.click();
};
</script></body></html>
