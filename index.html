<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V24 KAYA</title></head><body style="background:#000;color:#fff;font-family:Arial;padding:12px">
<h2 style="color:#00FF88;text-align:center">V24 - KAYA - NO FFMPEG - NO PROXY_MAIN</h2>
<input type="file" id="f" accept="video/*" multiple style="width:100%;padding:12px;background:#222;color:#fff;border-radius:10px">
<div id="info" style="color:#FFD700;margin:10px 0">V24 - Pili ka files</div>
<video id="v" controls playsinline style="width:100%;background:#000;border:2px solid #00FF88;border-radius:10px;min-height:220px"></video>
<div style="height:12px;background:#222;border-radius:10px;margin:10px 0"><div id="bar" style="height:100%;width:0%;background:#00FF88"></div></div>
<button id="merge" style="width:100%;padding:16px;background:#00FF88;color:#000;font-weight:bold;border:none;border-radius:25px">🔗 MERGE - KAYA NA!</button>
<button id="dl" style="width:100%;padding:16px;background:#FFD700;color:#000;font-weight:bold;border:none;border-radius:25px;display:none;margin-top:10px">💾 DOWNLOAD - BUO!</button>
<script>
let files=[],chunks=[],lastUrl=null;
const v=document.getElementById('v'),info=document.getElementById('info'),bar=document.getElementById('bar');
document.getElementById('f').onchange=e=>{
 files=[...e.target.files];
 info.textContent=files.length+' files - Ready - V24';
 if(files[0]) v.src=URL.createObjectURL(files[0]);
};
document.getElementById('merge').onclick=async()=>{
 if(!files.length) return alert('Pili ka files!');
 info.textContent='Merging... Wag isara';
 bar.style.width='5%';
 chunks=[];
 v.muted=false;
 v.src=URL.createObjectURL(files[0]);
 await v.play().catch(()=>{});
 // captureStream ng video mismo - may audio kasama
 const stream=v.captureStream ? v.captureStream() : v.mozCaptureStream();
 const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm';
 const rec=new MediaRecorder(stream,{mimeType:mime});
 rec.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
 rec.start(200);
 let idx=0;
 v.onended=async()=>{
  idx++;
  bar.style.width=Math.round(idx/files.length*100)+'%';
  if(idx>=files.length){
   rec.stop();
   rec.onstop=()=>{
    const blob=new Blob(chunks,{type:mime});
    lastUrl=URL.createObjectURL(blob);
    v.src=lastUrl; v.onended=null; v.play().catch(()=>{});
    document.getElementById('dl').style.display='block';
    info.textContent='DONE! '+files.length+' files - Buong video - V24 success!';
   };
   return;
  }
  v.src=URL.createObjectURL(files[idx]);
  info.textContent='Merging '+(idx+1)+'/'+files.length;
  await v.play().catch(()=>{});
 };
};
document.getElementById('dl').onclick=()=>{
 const a=document.createElement('a'); a.href=lastUrl; a.download='BOSS_V24_KAYA_'+Date.now()+'.webm'; a.click();
};
</script></body></html>
