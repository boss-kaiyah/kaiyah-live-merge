<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIMPLE COMBINE LANG</title>
<style>body{background:#000;color:#fff;font-family:Arial;padding:10px}video{width:100%;background:#000;border:2px solid #00FF88;border-radius:10px}button{background:#00FF88;color:#000;border:none;padding:16px;width:100%;border-radius:25px;font-weight:bold;font-size:16px;margin-top:10px}.small{font-size:12px;color:#aaa;text-align:center}.bar{height:16px;background:#222;border-radius:10px;overflow:hidden;margin:8px 0}.fill{height:100%;width:0%;background:#00FF88}</style></head><body>
<h3 style="color:#00FF88;text-align:center">SIMPLE COMBINE - 720p - BUO</h3>
<input type="file" id="f" accept="video/*" multiple style="width:100%;background:#222;color:#fff;padding:10px;border-radius:8px">
<div class="small" id="info">Piliin 13 files - combine lang</div>
<video id="v" controls playsinline></video>
<div class="bar"><div class="fill" id="bar"></div></div>
<div class="small" id="stat">Ready - combine lang gagawin</div>
<button id="go">COMBINE NA - 720P</button>
<div id="dl" style="display:none"><button id="down" style="background:#FFD700">DOWNLOAD - BUO NA 100%</button></div>
<script>
let files=[],durs=[],total=0,lastUrl=null;
const v=document.getElementById('v'),bar=document.getElementById('bar'),stat=document.getElementById('stat'),info=document.getElementById('info'),dl=document.getElementById('dl');
function fmt(s){let m=Math.floor(s/60),sc=Math.floor(s%60);return m+':'+String(sc).padStart(2,'0')}
function getDur(f){return new Promise(r=>{let x=document.createElement('video');x.preload='metadata';x.muted=true;let d=false;let t=setTimeout(()=>{if(!d){d=true;r(0)}},3000);x.onloadedmetadata=()=>{if(!d){d=true;clearTimeout(t);r(x.duration);URL.revokeObjectURL(x.src)}};x.onerror=()=>{if(!d){d=true;clearTimeout(t);r(0)}};x.src=URL.createObjectURL(f);});}
document.getElementById('f').onchange=async e=>{files=[...e.target.files];durs=[];total=0;for(let f of files){let d=await getDur(f);durs.push(d);total+=d}info.textContent=files.length+' files - '+fmt(total)+' total - combine lang';stat.textContent='Ready - '+fmt(total)+' - combine lang';v.src=URL.createObjectURL(files[0]);}
document.getElementById('go').onclick=async()=>{
 if(!files.length)return alert('Pili files');
 let W=1280,H=720,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;let ctx=canvas.getContext('2d');
 let cStream=canvas.captureStream(30);let actx=new AudioContext();let dest=actx.createMediaStreamDestination();
 let rec=new MediaRecorder(new MediaStream([...cStream.getVideoTracks(),...dest.stream.getAudioTracks()]),{mimeType:'video/webm;codecs=vp8,opus',videoBitsPerSecond:2500000});
 let chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 rec.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'});lastUrl=URL.createObjectURL(blob);v.src=lastUrl;dl.style.display='block';stat.textContent='100% BUO NA - '+fmt(total);bar.style.width='100%';alert('BUO NA BOSS - '+fmt(total)+' - 100%')};
 rec.start(1000);
 let g=0,i=0,cur=document.createElement('video');cur.muted=true;cur.playsInline=true;
 setInterval(()=>{if(cur.readyState>=2)ctx.drawImage(cur,0,0,W,H)},33);
 async function next(){
  if(i>=files.length){rec.stop();return}
  cur.src=URL.createObjectURL(files[i]);
  try{actx.createMediaElementSource(cur).connect(dest)}catch(e){}
  await new Promise(r=>cur.oncanplay=r);await cur.play().catch(()=>{});
  cur.onended=()=>{g+=durs[i]||cur.duration||0;i++;next()};
  cur.ontimeupdate=()=>{let now=g+cur.currentTime;bar.style.width=(now/total*100)+'%';stat.textContent=Math.floor(now/total*100)+'% - '+fmt(now)+'/'+fmt(total)+' - combine lang - wag pa download'};
 }
 next();
}
document.getElementById('down').onclick=()=>{let a=document.createElement('a');a.href=lastUrl;a.download='COMBINED_'+Date.now()+'.webm';a.click()}
</script></body></html>
